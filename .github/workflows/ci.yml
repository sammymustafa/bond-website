name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs strictly from package-lock.json, so a dependency
      # conflict fails here rather than in a production deploy.
      - run: npm ci

      - run: npx tsc --noEmit

      - run: npm run lint

      # Content rules: question headings, sourced numbers, resolving links.
      - run: npm run validate

      # `next build` plus the OpenNext step that turns it into the Cloudflare
      # Worker in .open-next/, the same build Workers Builds runs before a deploy.
      - run: npm run build:worker

      # Bundle the Worker exactly as `wrangler deploy` would, without uploading
      # it (no Cloudflare credentials needed). Fails if the Worker no longer
      # bundles, and prints its size against the Workers plan limit.
      - run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs strictly from package-lock.json, so a dependency
      # conflict fails here rather than in a production deploy.
      - run: npm ci

      - run: npx tsc --noEmit

      # Content rules: question headings, sourced numbers, resolving links.
      - run: npm run validate

      - run: npm run build
